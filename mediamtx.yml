###############################################################
# MediaMTX – Cấu hình cho hệ thống Live Stream Camera
# HLS (Live + DVR) + REST API động
###############################################################

# Mức độ log: error | warn | info | debug
logLevel: debug
logDestinations: [stdout]

###############################################################
# REST API – Backend NestJS sẽ gọi API này để cấu hình paths
# động theo từng camera lấy từ Database.
###############################################################
api: yes
apiAddress: :9997

###############################################################
# Authentication – Username/Password cho REST API & Streams
###############################################################
authMethod: internal
authInternalUsers:
  - user: admin
    pass: admin123
    permissions:
      - action: api
      - action: read
  - user: viewer
    pass: viewer123
    permissions:
      - action: read

###############################################################
# HLS Server – Phát HLS đến trình duyệt (LIVE + DVR)
# Cổng 8888 được trình duyệt truy cập trực tiếp.
# DVR window: hlsSegmentCount × hlsSegmentDuration = 600s (10 phút)
###############################################################
hls: yes
hlsAddress: :8888
hlsAllowOrigin: "*"
hlsAlwaysRemux: false
hlsSegmentCount: 300
hlsSegmentDuration: 2s
# Đóng HLS muxer sau 60s không có viewer (giải phóng bộ nhớ)
hlsMuxerCloseAfter: 60s

webrtc: false
srt: false

###############################################################
# Paths
###############################################################

# Tất cả camera paths được tạo ĐỘNG bởi NestJS Backend
# qua REST API /v3/config/paths/add/{id} với sourceOnDemand: true.
paths: {}
