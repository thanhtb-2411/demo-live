version: "3.8"

# ============================================================
# Live Stream Camera System: MediaMTX + NestJS Backend + Next.js Frontend
# Sử dụng network_mode: host để WebRTC ICE candidates hoạt động
# đúng trên Linux (không cần cấu hình thêm webrtcAdditionalHosts).
# ============================================================

services:
  # ----------------------------------------------------------
  # 1. MediaMTX – Media Server (WebRTC WHEP + REST API)
  # ----------------------------------------------------------
  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    container_name: mediamtx
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - recordings:/recordings

  # ----------------------------------------------------------
  # 2. NestJS Backend
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      - PORT=3002
      - MEDIAMTX_HOST=${MEDIAMTX_HOST:-localhost}
      - MEDIAMTX_API_PORT=${MEDIAMTX_API_PORT:-9997}
      - MEDIAMTX_API_USER=${MEDIAMTX_API_USER:-admin_user}
      - MEDIAMTX_API_PASS=${MEDIAMTX_API_PASS:-admin_password}
      - MEDIAMTX_WEBRTC_PORT=${MEDIAMTX_WEBRTC_PORT:-8889}
      - MEDIAMTX_PLAYBACK_PORT=${MEDIAMTX_PLAYBACK_PORT:-9996}
      - MEDIAMTX_HLS_PORT=${MEDIAMTX_HLS_PORT:-8888}
      - MEDIAMTX_RTSP_TRANSPORT=${MEDIAMTX_RTSP_TRANSPORT:-tcp}
      - MEDIAMTX_RTSP_PORT=${MEDIAMTX_RTSP_PORT:-8554}
      - MEDIAMTX_REENCODER_PASS=${MEDIAMTX_REENCODER_PASS:-reencoder123}
      - DVR_WINDOW_SECONDS=${DVR_WINDOW_SECONDS:-600}
      - JWT_SECRET=${JWT_SECRET}
      - DEMO_RTSP=${DEMO_RTSP}

  # ----------------------------------------------------------
  # 3. Next.js Frontend
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BACKEND_URL=http://localhost:3002
    container_name: frontend
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://localhost:3002
    depends_on:
      - backend

volumes:
  recordings:
