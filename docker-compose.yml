version: "3.8"

# ============================================================
# Live Stream Camera System: MediaMTX + NestJS Backend + Next.js Frontend
# Flow: RTSP Camera → MediaMTX (source passthrough) → HLS → Browser
# ============================================================

services:
  # ----------------------------------------------------------
  # 1. MediaMTX – Media Server (HLS + REST API)
  # ----------------------------------------------------------
  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    container_name: mediamtx
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - recordings:/recordings

  # ----------------------------------------------------------
  # 2. NestJS Backend
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      - MEDIAMTX_HOST=${MEDIAMTX_HOST:-localhost}
      - MEDIAMTX_API_PORT=${MEDIAMTX_API_PORT:-9997}
      - MEDIAMTX_API_USER=${MEDIAMTX_API_USER:-admin_user}
      - MEDIAMTX_API_PASS=${MEDIAMTX_API_PASS:-admin_password}
      - MEDIAMTX_HLS_PORT=${MEDIAMTX_HLS_PORT:-8888}
      - DVR_WINDOW_SECONDS=${DVR_WINDOW_SECONDS:-600}
      - JWT_SECRET=${JWT_SECRET}
      - DEMO_RTSP=${DEMO_RTSP}

  # ----------------------------------------------------------
  # 3. Next.js Frontend
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://localhost:3001
    depends_on:
      - backend

volumes:
  recordings:
